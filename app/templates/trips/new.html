{% extends "layout.html" %}
{% block scripts %}<script src="/static/trips.js?v={{ cat_version }}"></script>{% endblock %}
{% block body %}
<div class="page-head">
  <div><h1>Plan a trip</h1></div>
  <a class="btn ghost" href="/trips">Back to trips</a>
</div>
<section class="panel">
  <form method="post" action="/trips" class="trip-form" data-planning>
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <label class="field"><span>Truck</span>
      <select name="truck_id" required>
        <option value="">Select a truck</option>
        <option value="nearest">Closest truck to the pickup that is live on Samsara now</option>
        <option value="random">Any truck live on Samsara right now (random, with a driver)</option>
        {% for truck in trucks %}
        <option value="{{ truck.id }}" {% if truck_id == truck.id %}selected{% endif %}>Unit {{ truck.label }}{% if truck.driver_name %} · {{ truck.driver_name|title }}{% endif %}{% if truck.fuel_percent is not none %} · tank {{ truck.fuel_percent|number }}%{% endif %}{% if truck.location %} · {{ truck.location[:60] }}{% elif truck.latitude is none %} · no position{% endif %}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field"><span>Load or places</span>
      <textarea name="load" rows="14" required spellcheck="false" placeholder="Load ID: 88M4295
$5699.00

PU1: South Atlantic Warehouse
6104a Corporate Park Dr, Browns Summit, NC 27214
FCFS: 2026-11-17 04:00 - 23:55

DEL1: P&amp;g Wcmc
16110 Cosmos Street, Moreno Valley, CA 92551
FCFS: 2026-11-21 00:01 - 23:55">{{ text }}</textarea>
    </label>
    <div class="form-actions">
      <button class="btn" type="submit" data-planning-button>Plan the trip</button>
      <span class="subtle trip-planning" hidden>Planning... this takes about 15 seconds.</span>
    </div>
  </form>
</section>
{% endblock %}
