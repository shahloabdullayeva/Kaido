<div class="cat" id="cat" data-id="{{ cat_letter.id }}" data-csrf="{{ session.csrf }}" hidden>
  <div class="cat-bubble" role="dialog" aria-live="polite" aria-label="{{ 'Reminder' if cat_letter.kind == 'reminder' else 'A note for you' }}">
    <button type="button" class="cat-close" aria-label="Close">&times;</button>
    <p class="cat-hi">Hi {{ session.name }}!</p>
    <p class="cat-text">{{ cat_letter.message }}</p>
    <button type="button" class="btn cat-ok">{{ 'Got it' if cat_letter.kind == 'reminder' else 'Okay' }} &#9829;</button>
  </div>
  <svg class="cat-art" viewBox="0 0 150 170" aria-hidden="true">
    <path class="cat-fur cat-tail" d="M120 150 C150 140 150 100 132 92 C124 89 122 98 130 102 C140 108 138 132 116 138 Z"/>
