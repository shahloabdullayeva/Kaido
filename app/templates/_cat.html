<div class="notif" id="notif" data-csrf="{{ session.csrf }}" data-version="{{ cat_version }}">
  <button type="button" class="notif-button" aria-expanded="false" aria-controls="notif-panel" aria-label="Notifications" title="Notifications">
    <svg class="notif-bell" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span class="notif-count" hidden></span>
  </button>
  <div class="notif-panel" id="notif-panel" hidden>
    <div class="notif-head"><span>Notifications</span><button type="button" class="notif-all" hidden>Mark all read</button></div>
    <p class="notif-empty">Nothing new. Reminders you set will show up here when they are due.</p>
    <div class="notif-list"></div>
    <div class="notif-history" hidden>
      <p class="notif-history-head">Earlier</p>
      <ul></ul>
      <button type="button" class="notif-more" hidden></button>
    </div>
  </div>
</div>
