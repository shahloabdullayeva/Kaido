<aside class="assistant-drawer" id="assistant" data-assistant data-csrf="{{ session.csrf }}" data-company="{{ company.id }}" hidden aria-label="Ask Claude">
  <div class="drawer-head"><h2 class="drawer-title"><img src="/static/claude.png?v=1" alt="" width="18" height="18"> <span data-chat-title>Claude</span></h2>
    <div class="actions-row">
      <button type="button" class="btn ghost small" data-chat-history aria-expanded="false">History</button>
      <button type="button" class="btn ghost small" data-chat-new>New chat</button>
      <button type="button" class="btn ghost small" data-assistant-close aria-label="Close">Close</button></div></div>
  <div class="drawer-body" data-chat-body>
    <div class="chat-log" data-chat-log aria-live="polite"></div>
    <div class="chat-starters" data-chat-starters>
      <button type="button" class="btn ghost small" data-chat-ask="What needs my attention today, most urgent first?">What needs attention today?</button>
      <button type="button" class="btn ghost small" data-chat-ask="Which trucks are low on fuel or parked a long time?">Low fuel and long stops</button>
      <button type="button" class="btn ghost small" data-chat-ask="Who is running low on hours right now?">Who is low on hours?</button>
      <button type="button" class="btn ghost small" data-chat-ask="Sum up the open work orders and what each is waiting on.">Open work orders</button>
    </div>
  </div>
  <div class="drawer-body chat-history" data-chat-list hidden></div>
  <form class="chat-form" data-chat-form data-no-busy="1">
    <div class="chat-chips" data-chat-chips hidden></div>
    <textarea name="question" rows="2" maxlength="2000" placeholder="Ask about your fleet… / Flot haqida so‘rang…" aria-label="Your question"></textarea>
    <div class="actions-row">
      <label class="attach" title="Attach photos or PDFs"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7l8.5-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg><span>Attach</span><input type="file" name="files" multiple accept="application/pdf,image/jpeg,image/png,image/webp" data-chat-files aria-label="Attach photos or PDFs"></label>
      <span class="subtle chat-status" data-chat-status></span>
      <button class="btn" type="submit" data-busy="Asking…">Ask</button></div>
  </form>
</aside>
