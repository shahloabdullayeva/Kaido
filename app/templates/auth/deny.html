{% extends "auth_layout.html" %}
{% block body %}
<h1>Block this sign-in?</h1>
<p class="auth-note" style="margin-top:0">Locks the account for {{ lockout }} min and signs out everywhere.</p>
<form method="post" action="/login/deny/{{ handle }}">
  <input type="hidden" name="csrf" value="{{ anon_csrf() }}">
  <button class="btn danger" type="submit" data-busy="Blocking…">Block</button>
</form>
{% endblock %}
