<text x="20" y="262" font-size="12" fill="#c2185b" font-weight="bold">RIGHT</text>
<text x="20" y="315" font-size="13" fill="#5b6070">Example: "right rear drive, inside" is the inner tire on the passenger side of the last drive axle.</text>
</svg>
